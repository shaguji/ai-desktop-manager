<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>归墨 · 工作笔记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22bg2%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%233ecf80%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230d8f4c%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22page%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%220%25%22%20y2%3D%22100%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23ffffff%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23eaf3ec%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22gold%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%220%25%22%20y2%3D%22100%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23f7d27c%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23d69a2c%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22sheen2%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%220%25%22%20y2%3D%22100%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23ffffff%22%20stop-opacity%3D%220.16%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%2245%25%22%20stop-color%3D%22%23ffffff%22%20stop-opacity%3D%220.02%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23ffffff%22%20stop-opacity%3D%220%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Crect%20x%3D%2232%22%20y%3D%2232%22%20width%3D%22448%22%20height%3D%22448%22%20rx%3D%22110%22%20fill%3D%22url%28%23bg2%29%22%2F%3E%0A%20%20%3Crect%20x%3D%2232%22%20y%3D%2232%22%20width%3D%22448%22%20height%3D%22448%22%20rx%3D%22110%22%20fill%3D%22url%28%23sheen2%29%22%2F%3E%0A%20%20%3Crect%20x%3D%2237%22%20y%3D%2237%22%20width%3D%22438%22%20height%3D%22438%22%20rx%3D%22105%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-opacity%3D%220.20%22%20stroke-width%3D%229%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M148%20112%20h152%20l64%2064%20v216%20a18%2018%200%200%201%20-18%2018%20H148%20a18%2018%200%200%201%20-18%20-18%20V130%20a18%2018%200%200%201%2018%20-18%20z%22%20fill%3D%22url%28%23page%29%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M300%20112%20v48%20a16%2016%200%200%200%2016%2016%20h48%20z%22%20fill%3D%22%23c9e3d2%22%2F%3E%0A%20%20%3Crect%20x%3D%22170%22%20y%3D%22216%22%20width%3D%22130%22%20height%3D%2215%22%20rx%3D%227.5%22%20fill%3D%22%23237a4c%22%20opacity%3D%220.85%22%2F%3E%0A%20%20%3Crect%20x%3D%22170%22%20y%3D%22254%22%20width%3D%22152%22%20height%3D%2215%22%20rx%3D%227.5%22%20fill%3D%22%23237a4c%22%20opacity%3D%220.6%22%2F%3E%0A%20%20%3Crect%20x%3D%22170%22%20y%3D%22292%22%20width%3D%22106%22%20height%3D%2215%22%20rx%3D%227.5%22%20fill%3D%22%23237a4c%22%20opacity%3D%220.4%22%2F%3E%0A%20%20%3Cg%20transform%3D%22translate%28296%20322%29%20rotate%2845%29%22%3E%0A%20%20%20%20%3Crect%20x%3D%22-148%22%20y%3D%22-17%22%20width%3D%22112%22%20height%3D%2234%22%20rx%3D%2216%22%20fill%3D%22%23175e3b%22%2F%3E%0A%20%20%20%20%3Crect%20x%3D%22-46%22%20y%3D%22-17%22%20width%3D%2262%22%20height%3D%2234%22%20rx%3D%2212%22%20fill%3D%22%230f4529%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M16%20-17%20H50%20Q86%20-14%20100%200%20Q86%2014%2050%2017%20H16%20Z%22%20fill%3D%22url%28%23gold%29%22%2F%3E%0A%20%20%20%20%3Crect%20x%3D%2240%22%20y%3D%22-2.5%22%20width%3D%2248%22%20height%3D%225%22%20rx%3D%222.5%22%20fill%3D%22%238a5f14%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2242%22%20cy%3D%220%22%20r%3D%226.5%22%20fill%3D%22%238a5f14%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- ══════════ 顶栏 ══════════ -->
  <header class="topbar">
    <div class="search-wrap" id="searchWrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="搜索笔记、标签、正文内容…" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">Ctrl K</kbd>
      <button class="search-clear" id="searchClear" title="清除搜索" hidden>
        <svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="btnTheme" title="切换深浅色">
        <svg viewBox="0 0 24 24" fill="none" class="ic-sun"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 12H2.1M21.9 12h-2.4M6.7 6.7 5 5M19 19l-1.7-1.7M6.7 17.3 5 19M19 5l-1.7 1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none" class="ic-moon"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btnCollapse" title="收起/展开侧栏">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3.4" y="4.4" width="17.2" height="15.2" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M9.6 4.6v14.8" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置与数据">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12.2 2.6h-.4a1.9 1.9 0 0 0-1.9 1.9v.2a1.9 1.9 0 0 1-.95 1.65l-.4.24a1.9 1.9 0 0 1-1.9 0l-.15-.09a1.9 1.9 0 0 0-2.6.7l-.2.36a1.9 1.9 0 0 0 .7 2.6l.14.09a1.9 1.9 0 0 1 .95 1.64v.5a1.9 1.9 0 0 1-.95 1.65l-.15.09a1.9 1.9 0 0 0-.7 2.6l.2.36a1.9 1.9 0 0 0 2.6.7l.15-.08a1.9 1.9 0 0 1 1.9 0l.4.24a1.9 1.9 0 0 1 .95 1.65v.2a1.9 1.9 0 0 0 1.9 1.9h.4a1.9 1.9 0 0 0 1.9-1.9v-.2a1.9 1.9 0 0 1 .95-1.65l.4-.24a1.9 1.9 0 0 1 1.9 0l.15.08a1.9 1.9 0 0 0 2.6-.7l.2-.36a1.9 1.9 0 0 0-.7-2.6l-.15-.1a1.9 1.9 0 0 1-.95-1.64v-.5a1.9 1.9 0 0 1 .95-1.65l.15-.09a1.9 1.9 0 0 0 .7-2.6l-.2-.36a1.9 1.9 0 0 0-2.6-.7l-.15.09a1.9 1.9 0 0 1-1.9 0l-.4-.24a1.9 1.9 0 0 1-.95-1.65v-.2a1.9 1.9 0 0 0-1.9-1.9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ══════════ 主体 ══════════ -->
  <div class="workspace">

    <!-- 侧栏：笔记本树 + 标签 + 更多 -->
    <aside class="sidebar" id="sidebar">
      <nav class="side-scroll">
        <div class="side-card">
          <button class="nb-item" data-view="all" style="--nb-color:#7b8a80">
            <span class="nb-ic">全</span>
            <span class="nb-name">全部笔记</span><span class="nb-count" id="countAll">0</span>
          </button>
          <button class="nb-item" data-view="today" style="--nb-color:#2f74d0">
            <span class="nb-ic">今</span>
            <span class="nb-name">今日更新</span><span class="nb-count" id="countToday">0</span>
          </button>
        </div>

        <div class="side-section">
          <div class="side-title"><span>笔记本</span><button class="side-add" id="btnNbManage" title="管理笔记本（重命名 / 排序 / 新建分类）">⋯</button></div>
          <div id="nbTree" class="nb-list"></div>
          <div class="nb-extras">
            <button class="nb-item nb-extra" data-view="vault" style="--nb-color:#c99000">
              <span class="nb-ic">密</span><span class="nb-name">密码箱</span><span class="nb-count" id="countVault">—</span>
            </button>
            <button class="nb-item nb-extra" data-view="trash" style="--nb-color:#8d968f">
              <span class="nb-ic">回</span><span class="nb-name">回收站</span><span class="nb-count" id="countTrash">0</span>
            </button>
          </div>
        </div>

        <div class="side-section">
          <div class="side-title"><span>标签</span><button class="side-add" id="btnTagManage" title="管理标签（新建 / 删除）">⋯</button></div>
          <div class="tag-cloud" id="tagCloud"></div>
        </div>
      </nav>

      <div class="side-foot">
        <div class="storage">
          <div class="storage-bar"><i id="storageFill"></i></div>
          <div class="storage-txt"><span id="storageText">0 KB</span><span>本地存储</span></div>
        </div>
      </div>
    </aside>

    <!-- 列表栏 -->
    <section class="list-pane" id="listPane">
      <div class="list-head">
        <div class="list-title-row">
          <h2 id="listTitle">随手查</h2>
          <button class="gen-sum" id="btnDaySummary" title="按时间段生成周 / 月 / 季 / 年工作总结" hidden>
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.6l1.7 4.4 4.4 1.7-4.4 1.7L12 15.8l-1.7-4.4L5.9 9.7l4.4-1.7L12 3.6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M18.2 15.2l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9.9-2.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>生成工作总结</span>
          </button>
          <button class="mini-btn" id="btnListNew" title="新建笔记">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="list-sub">
          <span id="listSub">共 0 篇</span>
          <select id="sortSelect" class="sort-select" title="排序方式">
            <option value="updated">最近更新</option>
            <option value="created">创建时间</option>
            <option value="title">标题排序</option>
          </select>
        </div>
      </div>
      <div class="note-list" id="noteList"></div>
    </section>

    <!-- 编辑器 -->
    <section class="editor-pane" id="editorPane">
      <!-- 事项详情（事项跟踪视图下点选左侧事项后联动显示） -->
      <section class="todo-detail" id="trackDetail" hidden></section>

      <div class="empty-state" id="emptyState">
        <div class="empty-art">🗒️</div>
        <h3>开始记录你的工作</h3>
        <p>左侧选一篇笔记继续写，或者点列表右上角「＋」新建。</p>
        <div class="empty-actions">
          <button class="btn btn-primary" id="btnEmptyCapture">新建一篇</button>
        </div>
        <div class="empty-hints">
          <span><kbd>Ctrl</kbd><kbd>N</kbd> 新建</span>
          <span><kbd>Ctrl</kbd><kbd>K</kbd> 搜索</span>
          <span><kbd>Ctrl</kbd><kbd>S</kbd> 保存</span>
        </div>
      </div>

      <div class="editor" id="editor" hidden>
        <div class="editor-bars">
          <div class="editor-head">
          <div class="crumb">
            <span class="crumb-dot" id="crumbDot"></span>
            <select id="noteNotebook" class="crumb-select"></select>
            <span class="crumb-sep">/</span>
            <span class="crumb-time" id="crumbTime">—</span>
          </div>
          <div class="editor-actions">
            <button class="icon-btn sm" id="btnPin" title="置顶 (Ctrl+P)">
              <svg viewBox="0 0 24 24" fill="none"><path d="M9 3.8h6l-.8 5.1 3.3 3.1H6.5l3.3-3.1L9 3.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <div class="seg" id="viewSeg">
              <button data-mode="edit" class="active">编辑</button>
              <button data-mode="split">分栏</button>
              <button data-mode="preview">预览</button>
            </div>
            <button class="icon-btn sm" id="btnExport" title="导出为 Markdown">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.8v10.4m0 0 3.6-3.6M12 14.2 8.4 10.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.8 16.4v2.2c0 .9.7 1.6 1.6 1.6h11.2c.9 0 1.6-.7 1.6-1.6v-2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn sm" id="btnMore" title="更多">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>
            </button>
          </div>
        </div>

          <div class="toolbar" id="toolbar">
            <div class="tb-group">
              <button class="tb" data-md="bold" title="加粗 Ctrl+B"><b>B</b></button>
              <button class="tb" data-md="italic" title="斜体 Ctrl+I"><i>I</i></button>
              <button class="tb" data-md="strike" title="删除线"><s>S</s></button>
              <button class="tb" data-md="code" title="行内代码"><span class="tb-code">&lt;/&gt;</span></button>
            </div>
            <span class="tb-div"></span>
            <div class="tb-group">
              <button class="tb" data-md="h1" title="大标题">H1</button>
              <button class="tb" data-md="h2" title="中标题">H2</button>
              <button class="tb" data-md="h3" title="小标题">H3</button>
            </div>
            <span class="tb-div"></span>
            <div class="tb-group">
              <button class="tb" data-md="ul" title="无序列表">
                <svg viewBox="0 0 24 24" fill="none"><path d="M9 7h11M9 12h11M9 17h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="5" cy="7" r="1.3" fill="currentColor"/><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="5" cy="17" r="1.3" fill="currentColor"/></svg>
              </button>
              <button class="tb" data-md="ol" title="有序列表">
                <svg viewBox="0 0 24 24" fill="none"><path d="M10 7h10M10 12h10M10 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 6h1v3M3.6 12.4c.3-.5 1.6-.6 1.6.2 0 .7-1.6 1.4-1.6 2.4h1.8M3.6 17.4h1.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="tb" data-md="task" title="待办事项">
                <svg viewBox="0 0 24 24" fill="none"><rect x="3.6" y="5" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.6"/><path d="m4.9 7.4 1 1 1.6-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7.5h8M12 16.5h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><rect x="3.6" y="14" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.6"/></svg>
              </button>
              <button class="tb" data-md="quote" title="引用">
                <svg viewBox="0 0 24 24" fill="none"><path d="M9.5 6.5C6.6 7.6 5 9.9 5 13v4.5h5V12H7.4c.1-1.6.9-2.7 2.6-3.5l-.5-2ZM19 6.5c-2.9 1.1-4.5 3.4-4.5 6.5v4.5h5V12h-2.6c.1-1.6.9-2.7 2.6-3.5l-.5-2Z" fill="currentColor"/></svg>
              </button>
            </div>
            <span class="tb-div"></span>
            <div class="tb-group">
              <button class="tb" data-md="table" title="插入表格">
                <svg viewBox="0 0 24 24" fill="none"><rect x="3.6" y="4.8" width="16.8" height="14.4" rx="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M3.8 9.6h16.4M3.8 14.4h16.4M9.4 5v14M15 5v14" stroke="currentColor" stroke-width="1.4"/></svg>
              </button>
              <button class="tb" data-md="codeblock" title="代码块">
                <svg viewBox="0 0 24 24" fill="none"><path d="m8.4 8-4 4 4 4M15.6 8l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="tb" data-md="hr" title="分割线">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </button>
              <button class="tb" data-md="date" title="插入当前日期">
                <svg viewBox="0 0 24 24" fill="none"><rect x="3.8" y="5.4" width="16.4" height="14.4" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.8 10h16.4M8.4 3.6v3.4M15.6 3.6v3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </button>
            </div>
            <span class="tb-div"></span>
            <div class="tb-group">
              <button class="tb tb-tool" id="btnHandwrite" title="手写 / 流程图（画完插入笔记）">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4.4 19.6 5.6 15 15.4 5.2a1.8 1.8 0 0 1 2.5 0l.9.9a1.8 1.8 0 0 1 0 2.5L9 18.4l-4.6 1.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m14.2 6.4 3.4 3.4M4.6 19.4l3.4-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
              <button class="tb tb-tool" id="btnFlowEdit" title="编辑流程图：光标放到流程图图片所在行后点这里；双击图片行 / 阅读模式点图片也可以">
                <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="3.2" width="6.4" height="4.6" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="3.4" y="16.2" width="6.4" height="4.6" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14.2" y="16.2" width="6.4" height="4.6" rx="1" stroke="currentColor" stroke-width="1.6"/><path d="M12.2 7.8v4.4M12.2 12.2H6.6v4M12.2 12.2h5.4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
              <button class="tb tb-tool" id="btnVoice" title="语音输入（说话转文字，或录音留档）">
                <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="3.4" width="6" height="10.2" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0M12 17.6V21M9 21h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </button>
            </div>
            <span class="tb-spacer"></span>
            <button class="tb tb-template" id="btnUseTpl" title="插入模板内容">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 4.6h9.5L19 9.1v10.3c0 .6-.5 1.1-1.1 1.1H5c-.6 0-1.1-.5-1.1-1.1V5.7c0-.6.5-1.1 1.1-1.1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 12.4h7M8 15.4h4.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span>套用模板</span>
            </button>
          </div>

        </div>

        <div class="editor-scroll">
          <input id="noteTitle" class="note-title" type="text" placeholder="无标题笔记" spellcheck="false" maxlength="120">
          <div class="tag-row" id="noteTagRow"></div>

          <div class="editor-body" id="editorBody" data-mode="edit">
            <div class="pane-edit">
              <textarea id="noteContent" spellcheck="false" placeholder="在这里记录…支持 Markdown 语法，Ctrl+S 手动保存"></textarea>
            </div>
            <div class="pane-preview md-preview" id="notePreview"></div>
          </div>
        </div>

        <div class="editor-foot">
          <div class="foot-left" id="saveState">
            <span class="dot-ok"></span><span id="saveText">已保存</span>
          </div>
          <div class="foot-right">
            <span id="footMeta" class="foot-meta"></span>
            <span class="foot-sep" id="footMetaSep">·</span>
            <span id="wordCount">0 字</span>
            <span class="foot-sep">·</span>
            <span id="lineCount">0 行</span>
            <span class="foot-sep">·</span>
            <span id="tplBadge" class="tpl-badge" hidden></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 密码箱：网址 / 账号 / 密码（主密码加密，本地存储） -->
    <section class="vault-pane" id="vaultPane" hidden></section>
  </div>
</div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="assets/vault-ui.js"></script>

<script src="assets/sync.js"></script>
<script src="assets/ai.js"></script>
<script src="assets/home.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
